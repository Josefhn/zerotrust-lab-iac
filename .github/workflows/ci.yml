name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          pip install yamllint ansible-core ansible-lint

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint ansible/site.yml

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Scan IaC misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  integration:
    name: Deploy lab and run mTLS tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Generate PKI
        run: ./scripts/pki.sh certs

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Smoke tests (mTLS accepted / rejected)
        run: ./tests/smoke.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
