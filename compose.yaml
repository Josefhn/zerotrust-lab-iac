---
# Zero Trust lab: every request must present a valid client certificate (mTLS).
# The backend app is only reachable through the proxy, on an isolated network.
services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    networks: [edge, backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on: [app]
    restart: unless-stopped

  app:
    image: traefik/whoami:v1.10.3
    command: ["--port", "8080"]
    user: "65534:65534"
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  edge: {}
  backend:
    internal: true   # no route to the outside world
